<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
</head>
<body>
    <div class="links_wrapper">
        <div class="link"> <a href="/servelink/templates/register.html">Register</a></div>
        <div class="link"> <a href="/servelink/templates/login.html">Login</a></div>
        <div class="link"> <a href="/servelink/templates/index.html">Home</a></div>
    </div>
    <div class="messages">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p>{{ message}}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>
    <div class="registaration-form">
        <h2>Register Here</h2>
        <p>Please fill in the details below to register:</p>
        <form action="/register" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <hr>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <hr>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <hr>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <hr>
            <label for="role">Role:</label>
            <select id="role" name="role" required>
                <option value="volunteer">Volunteer</option>
                <option value="organization">Organization</option>
            </select>
            <hr>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
