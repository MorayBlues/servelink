{% extends 'base.html' %}
{% block title %}Register — ServeLink{% endblock %}
{% block content %}
<div style="max-width: 480px; margin: 0 auto;">
    <div class="page-header">
        <h1>Join ServeLink</h1>
        <p>Create your account to start volunteering.</p>
    </div>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>I am a</label>
                <select name="role">
                    <option value="volunteer">Volunteer</option>
                    <option value="organization">Organization</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
        </form>
        <p style="text-align:center; margin-top:1rem; color:var(--text-secondary); font-size:0.9rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color:var(--green-mid)">Login</a>
        </p>
    </div>
</div>
{% endblock %}
