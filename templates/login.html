{% extends 'base.html' %}
{% block title %} Login -ServeLink{% endblock %}
{% block content %}
<div style="max-width:480px; margin: 0 auto;">
    <div class="page-header">
        <h1>Login</h1>
        <p>Please enter your credentials to login</p>
    </div>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required>
            </div> 
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div> 
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);font-size: 0.9rem;">
            Don't have an account? <a href="{{url_for('register')}}" style="color: var(--green-mid);">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
